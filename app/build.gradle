plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'seldia.charset-shim'
}

// Credenciales opcionales (nunca se escriben secretos en Git).
// Se leen desde variables de entorno o desde gradle.properties local.
def youtubeApiKey = System.getenv("SELDIA_YOUTUBE_API_KEY") ?: (project.findProperty("youtube.api.key") ?: "")
def spotifyClientId = System.getenv("SELDIA_SPOTIFY_CLIENT_ID") ?: (project.findProperty("spotify.client.id") ?: "")

android {
    namespace 'com.seldia.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.seldia.music"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "YOUTUBE_API_KEY", "\"${youtubeApiKey}\""
        buildConfigField "String", "SPOTIFY_CLIENT_ID", "\"${spotifyClientId}\""
        buildConfigField "String", "SPOTIFY_REDIRECT_URI", "\"com.seldia.music://callback\""

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources.excludes += [
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE',
            'META-INF/LICENSE.txt',
            'META-INF/NOTICE',
            'META-INF/NOTICE.txt',
            'META-INF/INDEX.LIST'
        ]
    }
}

dependencies {
    // AndroidX base
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    // Lifecycle + coroutines
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Media3 (ExoPlayer + MediaSessionService)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    // Room (persistencia local)
    implementation 'androidx.room:room-runtime:2.8.0'
    implementation 'androidx.room:room-ktx:2.8.0'
    kapt 'androidx.room:room-compiler:2.8.0'

    // Extracción de audio de YouTube (NewPipe Extractor)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    // APIs de Java 9+ (p. ej. URLDecoder.decode(String, Charset)) para Android 8.1 (minSdk 27)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Red (YouTube APIs)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Imágenes
    implementation 'io.coil-kt:coil:2.6.0'
}
